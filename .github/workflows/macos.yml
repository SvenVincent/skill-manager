# macOS 构建 · arm64 + x64 两个 dmg
#
# 触发
#   workflow_dispatch  单独构建 macOS
#   workflow_call      由 release.yml 调用
#
# 产物
#   SkillManager_<版本>_aarch64.dmg   Apple Silicon
#   SkillManager_<版本>_x64.dmg       Intel

name: Build · macOS

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  dmg:
    name: ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13（Intel runner）已被 GitHub 下线，x64 改在 Apple Silicon
          # runner 上交叉编译，产物仍是原生 Intel 二进制
          - label: macOS arm64 · dmg
            target: aarch64-apple-darwin

          - label: macOS x64 · dmg
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      # vite / eslint 要求 Node ≥ 22.12
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm ci

      # tauri.conf.json 未配 beforeBuildCommand，dist/ 需自己先构建出来，
      # 否则 tauri build 会报 "Unable to find your web assets"
      - name: 构建前端
        run: npm run build

      - name: 构建 dmg
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[name]-[version]-[platform]-[arch]-[bundle]"
          args: --bundles dmg --target ${{ matrix.target }}
