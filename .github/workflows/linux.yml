# Linux 构建 · AppImage + deb
#
# 触发
#   workflow_dispatch  单独构建 Linux
#   workflow_call      由 release.yml 调用
#
# 产物
#   SkillManager_<版本>_amd64.AppImage
#   SkillManager_<版本>_amd64.deb

name: Build · Linux

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    name: Linux x64 · AppImage + deb
    # 22.04 而非 24.04：glibc 更旧，AppImage / deb 能覆盖更多发行版
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # vite / eslint 要求 Node ≥ 22.12
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xdg-utils \
            libfuse2

      # tauri.conf.json 未配 beforeBuildCommand，dist/ 需自己先构建出来，
      # 否则 tauri build 会报 "Unable to find your web assets"
      - name: 构建前端
        run: npm run build

      - name: 构建 AppImage + deb
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[name]-[version]-[platform]-[arch]-[bundle]"
          args: --bundles appimage,deb
