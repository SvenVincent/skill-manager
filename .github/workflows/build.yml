# SkillManager 三端构建 / 发布流水线
#
# 阶段
#   解析版本号    读出 tauri.conf.json 的版本，校验 tag 与之一致
#   桌面端矩阵    四端并行构建，各自上传 Artifact（不碰 Release）
#   发布 Release  汇总全部 Artifact，一次性创建 Release 并挂上所有安装包
#
# 触发
#   push v* 标签      完整跑三个阶段
#   workflow_dispatch 只跑前两个阶段，产物从本次运行的 Artifacts 下载
#
# 产物
#   macOS   SkillManager_<版本>_aarch64.dmg        Apple Silicon
#           SkillManager_<版本>_x64.dmg            Intel
#   Windows SkillManager_<版本>_x64-setup.exe      NSIS 安装器
#           SkillManager_<版本>_x64_portable.zip   免安装绿色版
#   Linux   SkillManager_<版本>_amd64.AppImage
#           SkillManager_<版本>_amd64.deb
#
# 发版：同步 tauri.conf.json、Cargo.toml、package.json 三处版本号后提交，
#       再 git tag v<版本> && git push origin master --tags

name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ── 1. 解析版本号 ────────────────────────────────────────────────────
  version:
    name: 解析版本号
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: 读取并校验版本号
        id: resolve
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tauri.conf.json version = $version"

          # tag 与配置版本号不一致时产物名和 Release 标题会对不上，提前提示
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::warning::tag ${GITHUB_REF_NAME} 与 tauri.conf.json 版本号 $version 不一致"
          fi

  # ── 2. 四端并行构建 ──────────────────────────────────────────────────
  desktop:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13（Intel runner）已被 GitHub 下线，x64 改在 Apple Silicon
          # runner 上交叉编译，产物仍是原生 Intel 二进制
          - label: macOS arm64 · dmg
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg

          - label: macOS x64 · dmg
            os: macos-15
            target: x86_64-apple-darwin
            bundles: dmg

          - label: Windows x64 · nsis + 免安装
            os: windows-latest
            bundles: nsis
            portable: true

          # 22.04 而非 24.04：glibc 更旧，AppImage / deb 能覆盖更多发行版
          - label: Linux x64 · AppImage + deb
            os: ubuntu-22.04
            bundles: appimage,deb

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Linux 系统依赖
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xdg-utils \
            libfuse2

      # tauri.conf.json 未配 beforeBuildCommand，dist/ 需自己先构建出来，
      # 否则 tauri build 会报 "Unable to find your web assets"
      - name: 构建前端
        run: npm run build

      # 只构建并上传 Artifact，Release 交给 publish 阶段统一处理
      - name: 构建并打包
        uses: tauri-apps/tauri-action@v1
        with:
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[name]-[version]-[platform]-[arch]-[bundle]"
          args: --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) }}

      # Tauri 没有内置免安装打包：编译出的 exe 已内嵌前端资源，压成 zip 即可
      - name: 生成 Windows 免安装版
        if: matrix.portable
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $dir = "src-tauri/target/release"
          $exe = @("SkillManager.exe", "skill-manager.exe") |
            ForEach-Object { Join-Path $dir $_ } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $exe) {
            $found = (Get-ChildItem $dir -Filter *.exe).Name -join ", "
            throw "未找到主程序可执行文件，$dir 下只有：$found"
          }

          $zip = "SkillManager_${env:APP_VERSION}_x64_portable.zip"
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item -Path $exe -Destination portable/SkillManager.exe
          Compress-Archive -Path portable/SkillManager.exe -DestinationPath $zip -Force
          Write-Host "已生成 $zip"

      - name: 上传免安装版
        if: matrix.portable
        uses: actions/upload-artifact@v7
        with:
          name: SkillManager-${{ needs.version.outputs.version }}-windows-x64-portable
          path: SkillManager_*_x64_portable.zip

  # ── 3. 汇总发布 ──────────────────────────────────────────────────────
  publish:
    name: 发布 GitHub Release
    needs: [version, desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh release-assets

      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖上传（便于重跑）"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" \
              --title "SkillManager $VERSION" \
              --generate-notes \
              release-assets/*
          fi
